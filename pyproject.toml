[project]
name = "hello-world-mcp-server-builder"
version = "0.1.0"
description = "Dagger-based build system for Hello World MCP Server"
authors = [
    {name = "Stephen Taylor",email = "staylorx@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "dagger-io>=0.9.0",
    "anyio>=3.0.0",
    "click>=8.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
