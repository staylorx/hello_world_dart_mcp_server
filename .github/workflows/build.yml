name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows
            arch: amd64
            runner: windows-latest
            dart-arch: x64
            output: hello_world_mcp_server.exe
          - os: windows
            arch: arm64
            runner: windows-latest
            dart-arch: arm64
            output: hello_world_mcp_server.exe
          
          # Linux builds
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            dart-arch: x64
            output: hello_world_mcp_server
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            dart-arch: arm64
            output: hello_world_mcp_server
          
          # macOS builds
          - os: macos
            arch: amd64
            runner: macos-13  # Intel-based runner
            dart-arch: x64
            output: hello_world_mcp_server
          - os: macos
            arch: arm64
            runner: macos-latest  # Apple Silicon runner
            dart-arch: arm64
            output: hello_world_mcp_server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Dart SDK (Manual Beta Channel)
      run: |
        if [ "${{ matrix.os }}" = "linux" ]; then
          # Download specific beta version for Linux
          if [ "${{ matrix.dart-arch }}" = "x64" ]; then
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-linux-x64-release.zip
          else
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-linux-arm64-release.zip
          fi
          unzip dart-sdk.zip
          echo "$PWD/dart-sdk/bin" >> $GITHUB_PATH
        elif [ "${{ matrix.os }}" = "macos" ]; then
          # Download specific beta version for macOS
          if [ "${{ matrix.dart-arch }}" = "x64" ]; then
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-macos-x64-release.zip
          else
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-macos-arm64-release.zip
          fi
          unzip dart-sdk.zip
          echo "$PWD/dart-sdk/bin" >> $GITHUB_PATH
        else
          # Windows
          if [ "${{ matrix.dart-arch }}" = "x64" ]; then
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-windows-x64-release.zip
          else
            curl -L -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/beta/release/3.9.2/sdk/dartsdk-windows-arm64-release.zip
          fi
          unzip dart-sdk.zip
          echo "$PWD/dart-sdk/bin" >> $GITHUB_PATH
        fi
      shell: bash

    - name: Get dependencies
      run: dart pub get

    - name: Verify Dart installation
      run: |
        dart --version
        dart pub deps

    - name: Build executable
      run: dart compile exe bin/hello_world_mcp_server.dart -o ${{ matrix.output }}

    - name: Verify executable (Unix)
      if: matrix.os != 'windows'
      run: |
        file ${{ matrix.output }}
        ls -la ${{ matrix.output }}

    - name: Verify executable (Windows)
      if: matrix.os == 'windows'
      run: |
        Get-ItemProperty ${{ matrix.output }} | Select-Object Name, Length, LastWriteTime
        
    - name: Create artifact directory
      run: mkdir -p artifacts

    - name: Copy executable to artifacts (Unix)
      if: matrix.os != 'windows'
      run: cp ${{ matrix.output }} artifacts/hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}

    - name: Copy executable to artifacts (Windows)
      if: matrix.os == 'windows'
      run: Copy-Item ${{ matrix.output }} artifacts/hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}.exe

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}
        path: artifacts/
        retention-days: 30

  # Create a combined release with all binaries
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Display structure of downloaded files
      run: ls -la release-artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find release-artifacts -type f -name "hello_world_mcp_server*" -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Create checksums
      run: |
        cd release-assets
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
        body: |
          ## Hello World MCP Server - Multi-Platform Release
          
          This release includes compiled binaries for:
          
          ### Windows (64-bit)
          - `hello_world_mcp_server-windows-amd64.exe` - Intel/AMD x64
          - `hello_world_mcp_server-windows-arm64.exe` - ARM64
          
          ### Linux (64-bit)
          - `hello_world_mcp_server-linux-amd64` - Intel/AMD x64
          - `hello_world_mcp_server-linux-arm64` - ARM64
          
          ### macOS (64-bit)
          - `hello_world_mcp_server-macos-amd64` - Intel x64
          - `hello_world_mcp_server-macos-arm64` - Apple Silicon (M1/M2/M3)
          
          ### Installation
          
          1. Download the appropriate binary for your platform
          2. Make it executable (Unix systems): `chmod +x hello_world_mcp_server-*`
          3. Run directly: `./hello_world_mcp_server-*`
          
          ### Verification
          
          Use the included `checksums.txt` file to verify the integrity of downloaded binaries:
          ```bash
          sha256sum -c checksums.txt
          ```
          
          Built with Dart SDK and GitHub Actions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test builds on different architectures
  test:
    name: Test ${{ matrix.os }}-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: macos
            arch: amd64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-latest

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}
        path: test-artifacts

    - name: Test executable (Unix)
      if: matrix.os != 'windows'
      run: |
        chmod +x test-artifacts/hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}
        echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | timeout 5s test-artifacts/hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }} || true

    - name: Test executable (Windows)
      if: matrix.os == 'windows'
      run: |
        echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | test-artifacts/hello_world_mcp_server-${{ matrix.os }}-${{ matrix.arch }}.exe
      timeout-minutes: 1
      continue-on-error: true